<div class="lista-plantas">
    @for (planta of plantas; track planta.id) {
        <app-planta-card
        [nome]="planta.nome"
        [luz]="planta.luz"
        [umidade]="planta.umidade"
        [temperatura]="planta.temperatura"
        [estado]="planta.estado">
        </app-planta-card>
    }
</div>
